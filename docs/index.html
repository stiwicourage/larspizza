<!doctype html>
<html lang="da">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lars' Pizza | Menu</title>
    <meta
        name="description"
        content="Se Lars' Pizzas menu for Haslev og Lynge."
    >
    <meta name="theme-color" content="#9f2f24">
    <link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
    <header class="hero">
        <p class="eyebrow">Lars' Pizza</p>
        <h1>V&aelig;lg din menu</h1>
        <p class="lead">
            V&aelig;lg lokation for at se de pizzaer, der er tilg&aelig;ngelige.
        </p>
    </header>

    <main>
        <section class="menu-card" aria-labelledby="menu-title">
            <div class="location-picker">
                <label for="location-select">Lokation</label>
                <select id="location-select">
                    <option value="">Henter lokationer...</option>
                </select>
            </div>
            <div class="menu-heading">
                <h2 id="menu-title">Menu</h2>
                <p id="menu-status" role="status">V&aelig;lg en lokation for at se menuen.</p>
            </div>
            <div id="menu-list" class="menu-list" aria-live="polite"></div>
            <section class="order-panel" aria-labelledby="order-title">
                <h2 id="order-title">Bestil pizza</h2>
                <p>Tilføj pizzaer fra menuen, og skriv hvem der skal have dem.</p>
                <form id="order-form">
                    <label for="customer-name">Bestillers navn</label>
                    <input id="customer-name" name="customer_name" required>
                    <label for="order-date">Dato</label>
                    <input id="order-date" name="order_date" type="date" required>
                    <div id="order-list" class="order-list"></div>
                    <button type="submit">Gennemgå bestilling</button>
                    <p id="order-status" role="status"></p>
                </form>
            </section>
        </section>
    </main>

    <footer class="site-footer">
        <p>Lars' Pizza i Haslev og Lynge.</p>
    </footer>
    <script src="assets/js/menu.js" defer></script>
</body>
</html>
